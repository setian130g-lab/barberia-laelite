<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Barberos | Barbería La Élite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon Oficial -->
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#080c14] text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Luces de fondo -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[350px] bg-amber-500/10 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    <!-- Logo & Regreso -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 group mb-4">
        <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-amber-500/50 shadow-xl shadow-amber-500/20 group-hover:border-amber-400 group-hover:scale-105 transition-all bg-black">
          <img 
            src="logo.png" 
            alt="Logo Barbería La Élite" 
            class="w-full h-full object-cover"
          />
        </div>
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold font-heading text-white tracking-wider">
        BARBERÍA <span class="gold-gradient-text">LA ÉLITE</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">Portal Exclusivo para Barberos (Deison / Juan Pablo)</p>
    </div>

    <!-- Tarjeta de Login -->
    <div class="bg-slate-900/90 border border-amber-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl gold-border-glow backdrop-blur-md">
      <h2 class="text-lg font-bold text-white mb-2 font-heading">Iniciar Sesión</h2>
      <p class="text-xs text-slate-400 mb-6">Introduce tus credenciales para ver tu agenda de citas del día.</p>

      <!-- Alerta de Error -->
      <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-950/70 border border-red-500/40 text-red-200 text-xs"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Usuario del Barbero</label>
          <div class="relative">
            <input 
              type="text" 
              id="username" 
              placeholder="deison o juanpablo" 
              required
              class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none transition-all"
            />
            <span class="absolute right-3.5 top-3 text-slate-500 text-sm">👤</span>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-semibold text-slate-300">Contraseña</label>
            <span class="text-[11px] text-amber-400/80">clave por defecto: 123</span>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              required
              class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none transition-all"
            />
            <span class="absolute right-3.5 top-3 text-slate-500 text-sm">🔑</span>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn-gold w-full py-3.5 rounded-xl font-bold text-sm tracking-wide transition-all mt-2">
          Entrar a Mi Panel
        </button>
      </form>

      <!-- Separador -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-3 text-slate-500 font-medium">O Acceso Rápido Demo</span></div>
      </div>

      <!-- Botones de 1 Clic para Prueba Inmediata -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="quickLogin('deison')" class="p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 rounded-xl text-left transition-all">
          <span class="block text-xs font-bold text-amber-300">💈 Entrar Deison</span>
          <span class="block text-[10px] text-slate-400">Ver citas de Deison</span>
        </button>
        <button onclick="quickLogin('juanpablo')" class="p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 rounded-xl text-left transition-all">
          <span class="block text-xs font-bold text-amber-300">✂️ Entrar Juan Pablo</span>
          <span class="block text-[10px] text-slate-400">Ver citas Juan Pablo</span>
        </button>
      </div>
    </div>

    <!-- Enlace a la web -->
    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400 transition-colors inline-flex items-center gap-1.5">
        <span>← Volver a la web principal de la barbería</span>
      </a>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const userInp = document.getElementById('username');
    const passInp = document.getElementById('password');
    const errorBox = document.getElementById('login-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const result = loginBarber(userInp.value, passInp.value);
      if (result.success) {
        window.location.href = `panel-barbero.html?barbero=${result.user.username}`;
      } else {
        errorBox.textContent = result.message;
        errorBox.classList.remove('hidden');
      }
    });

    function quickLogin(barberUser) {
      const res = loginBarber(barberUser, '123');
      if (res.success) {
        window.location.href = `panel-barbero.html?barbero=${barberUser}`;
      }
    }
  </script>
</body>
</html>
